# LiteLLM proxy config (P1.4a — the agent-internal spend chokepoint).
#
# The proxy is the physical endpoint the OpenHands agent's own LLM calls flow
# through when TVASHTR's `litellm_proxy_enabled` is on. It is a docker-compose
# sibling to Postgres (see docker-compose.yml). 4a is plumbing + reachability only;
# the per-virtual-key budget that cuts a runaway agent off mid-loop is P1.4b.
#
# Posture matches tvashtr's gateway: quiet, telemetry off, no phone-home.

model_list:
  # Wildcard passthrough (verified against litellm 1.89.0's pattern router): any
  # `openrouter/<...>` slug the client sends routes through with the single OpenRouter
  # key. This covers EVERY agent slug in use — the Engineer (openrouter/openai/gpt-4o-mini,
  # teams.py) and the default (openrouter/meta-llama/llama-3.1-8b-instruct, config.py) —
  # with no per-model enumeration. The client sends `litellm_proxy/openrouter/...`; litellm
  # strips the `litellm_proxy/` provider prefix, so the proxy matches `openrouter/...` here.
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY
  # Sibling-provider passthroughs (forward-looking; route the other .env providers if a
  # run ever points the agent at them directly). Unused in 4a; absent keys simply 401 if
  # called, which never happens on the offline/no-key path.
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "gemini/*"
    litellm_params:
      model: "gemini/*"
      api_key: os.environ/GEMINI_API_KEY
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  # Protects the proxy's admin/key API. Sourced from the env (compose passes
  # LITELLM_MASTER_KEY); also the api_key the agent presents when the proxy is on.
  master_key: os.environ/LITELLM_MASTER_KEY
  # Separate logical `litellm` database on the SAME Postgres instance — the proxy
  # auto-creates its own tables here on boot (virtual keys + budgets land in 4b). The
  # app/tests keep using the `tvashtr` database; no collision.
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # No phone-home, mirroring gateway.py (litellm.telemetry = False).
  telemetry: false
