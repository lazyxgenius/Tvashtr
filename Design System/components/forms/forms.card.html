<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); }
  .wrap { padding: 28px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 32px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Select, Checkbox, Switch } = window.DesignSystem_dbaa69;
  function Demo() {
    return (
      <>
        <div className="stack">
          <Input label="Workspace name" defaultValue="Looms & Letters" helper="Shown across your team." />
          <Input label="Email" type="email" error="That address doesn’t look right." defaultValue="ada@" />
          <Select label="Model" options={['Tvashtr Loom', 'Tvashtr Loom mini', 'Tvashtr Weave']} />
        </div>
        <div className="stack">
          <Input label="What are you working on?" optional multiline rows={3} placeholder="A short note to set the scene…" />
          <div className="stack" style={{ gap: '12px' }}>
            <Checkbox label="Email me a calm weekly digest" defaultChecked />
            <Checkbox type="radio" name="p" label="Studio" defaultChecked />
            <Checkbox type="radio" name="p" label="Team" />
            <Switch label="Stream responses" defaultChecked />
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
