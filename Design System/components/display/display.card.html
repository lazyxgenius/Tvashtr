<!-- @dsCard group="Components" viewport="700x400" name="Cards, Badges & Avatars" subtitle="Surfaces, status pills and avatars" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); }
  .wrap { padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { font-family: var(--font-ui); font-size: var(--fs-micro); letter-spacing: var(--tracking-wide);
         text-transform: uppercase; color: var(--text-tertiary); width: 100%; }
  h4 { font-family: var(--font-display); font-weight: 400; margin: 0 0 6px; font-size: var(--fs-h4); letter-spacing: -0.01em; }
  p { margin: 0; font-size: var(--fs-caption); color: var(--text-secondary); line-height: 1.5; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Card, Badge, Avatar } = window.DesignSystem_dbaa69;
  function Demo() {
    return (
      <>
        <div className="cards">
          <Card><h4>Paper</h4><p>Hairline border, large radius, calm.</p></Card>
          <Card variant="panel"><h4>Panel</h4><p>Light-gray fill for grouped settings.</p></Card>
          <Card variant="inverse"><h4 style={{color:'var(--text-inverse)'}}>Charcoal</h4><p style={{color:'var(--text-inverse-dim)'}}>Cream text on near-black.</p></Card>
        </div>
        <div className="row">
          <span className="lbl">Badges</span>
          <Badge>Draft</Badge>
          <Badge variant="accent">New</Badge>
          <Badge variant="success" dot>Connected</Badge>
          <Badge variant="info">Beta</Badge>
          <Badge variant="warning">Limited</Badge>
          <Badge variant="outline">v0.4</Badge>
        </div>
        <div className="row">
          <span className="lbl">Avatars</span>
          <Avatar name="Ada Lovelace" size="sm" />
          <Avatar name="Grace Hopper" size="md" />
          <Avatar name="Tvashtr" accent shape="square" size="md" />
          <Avatar name="Edith Clarke" size="lg" />
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
