<!-- @dsCard group="Colors" viewport="700x190" name="Ink & warm neutrals" subtitle="Warm near-black text; stone grays — never cool gray" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-ui); }
  .wrap { padding: 26px 30px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 9px; }
  .chip { height: 72px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .n { font-size: var(--fs-caption); color: var(--text-primary); font-weight: 500; }
  .h { font-size: var(--fs-micro); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .m { font-size: var(--fs-micro); color: var(--text-secondary); }
</style></head>
<body><div class="wrap">
  <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="n">Ink 900</div><div class="h">#141413</div><div class="m">Primary text</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="n">Ink 700</div><div class="h">#3A3833</div><div class="m">Hover dark</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="n">Ink 500</div><div class="h">#6E6B61</div><div class="m">Secondary</div></div>
  <div class="sw"><div class="chip" style="background:var(--stone-400)"></div><div class="n">Stone 400</div><div class="h">#B0AEA5</div><div class="m">Placeholder</div></div>
  <div class="sw"><div class="chip" style="background:var(--stone-300)"></div><div class="n">Stone 300</div><div class="h">#C7C4BA</div><div class="m">Disabled</div></div>
  <div class="sw"><div class="chip" style="background:var(--line-300)"></div><div class="n">Line 300</div><div class="h">#E0DDD0</div><div class="m">Hairline</div></div>
</div></body></html>
