<!-- @dsCard group="Type" viewport="700x240" name="Headings — serif scale" subtitle="H1–H4 in Newsreader, snug tracking" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); }
  .wrap { padding: 26px 32px; display: flex; flex-direction: column; gap: 16px; }
  .line { display: flex; align-items: baseline; gap: 18px; }
  .spec { font-family: var(--font-ui); font-size: var(--fs-micro); color: var(--text-tertiary);
          width: 110px; flex: none; font-variant-numeric: tabular-nums; }
  .h { font-family: var(--font-serif); font-weight: 400; color: var(--text-primary); letter-spacing: -0.01em; line-height: 1.2; }
</style></head>
<body><div class="wrap">
  <div class="line"><span class="spec">H1 · 32 / 400</span><span class="h" style="font-size:32px">The loom remembers</span></div>
  <div class="line"><span class="spec">H2 · 26 / 400</span><span class="h" style="font-size:26px">Threads you can pick back up</span></div>
  <div class="line"><span class="spec">H3 · 21 / 400</span><span class="h" style="font-size:21px">A place for unfinished thinking</span></div>
  <div class="line"><span class="spec">H4 · 18 / 400</span><span class="h" style="font-size:18px">Small headings stay serif, too</span></div>
</div></body></html>
