<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces — paper & panels" subtitle="Warm cream backgrounds; never pure white" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-ui); }
  .wrap { padding: 26px 30px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .sw { display: flex; flex-direction: column; gap: 10px; }
  .chip { height: 76px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .n { font-size: var(--fs-caption); color: var(--text-primary); font-weight: 500; }
  .h { font-size: var(--fs-micro); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .m { font-size: var(--fs-micro); color: var(--text-secondary); }
</style></head>
<body><div class="wrap">
  <div class="sw"><div class="chip" style="background:var(--cream-50)"></div><div class="n">Cream 50</div><div class="h">#FDFCFA</div><div class="m">Lift</div></div>
  <div class="sw"><div class="chip" style="background:var(--cream-100)"></div><div class="n">Cream 100</div><div class="h">#FAF9F5</div><div class="m">Paper / page</div></div>
  <div class="sw"><div class="chip" style="background:var(--cream-200)"></div><div class="n">Cream 200</div><div class="h">#F4F2EA</div><div class="m">Alt band</div></div>
  <div class="sw"><div class="chip" style="background:var(--panel-300)"></div><div class="n">Panel 300</div><div class="h">#E8E6DC</div><div class="m">Cards / inputs</div></div>
  <div class="sw"><div class="chip" style="background:var(--panel-400)"></div><div class="n">Panel 400</div><div class="h">#DEDBCE</div><div class="m">Pressed</div></div>
</div></body></html>
