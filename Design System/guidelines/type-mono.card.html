<!-- @dsCard group="Type" viewport="700x200" name="Mono — IBM Plex Mono" subtitle="Terminal, CLI output and inline code" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); }
  .wrap { padding: 26px 32px; display: flex; flex-direction: column; gap: 16px; }
  .term { background: var(--ink-900); border-radius: var(--radius-md); padding: 18px 20px;
          font-family: var(--font-mono); font-size: 14px; line-height: 1.65; color: var(--cream-100); }
  .term .p { color: var(--coral-500); }
  .term .c { color: var(--stone-400); }
  .term .g { color: var(--sage-500); }
  .inl { font-family: var(--font-sans); font-size: 15px; color: var(--text-primary); line-height: 1.6; }
  .inl code { font-family: var(--font-mono); font-size: 13px; background: var(--panel-300);
              border: 1px solid var(--border-hairline); border-radius: 5px; padding: 1px 6px; color: var(--coral-700); }
</style></head>
<body><div class="wrap">
  <div class="term"><span class="p">tvashtr ~</span> weave build<br><span class="c"># spinning up the loom…</span><br><span class="g">✓ done</span> in 1.2s · 14 threads</div>
  <p class="inl">Inline code like <code>tvashtr.config.ts</code> sits comfortably inside running Inter text.</p>
</div></body></html>
