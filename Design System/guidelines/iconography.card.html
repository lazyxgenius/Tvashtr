<!-- @dsCard group="Brand" viewport="700x210" name="Iconography — Lucide" subtitle="Minimal 1.6px line icons; geometric primitives; coral reserved for the mark" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-ui); }
  .wrap { padding: 26px 30px; display: flex; flex-direction: column; gap: 18px; }
  .grid { display: flex; gap: 22px; flex-wrap: wrap; }
  .grid svg { width: 24px; height: 24px; color: var(--ink-700); stroke-width: 1.6; }
  .prims { display: flex; gap: 16px; align-items: center; }
  .prims svg { width: 22px; height: 22px; color: var(--coral-500); }
  .lbl { font-size: var(--fs-micro); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-tertiary); }
  .note { font-size: var(--fs-caption); color: var(--text-secondary); }
</style></head>
<body><div class="wrap">
  <div>
    <div class="lbl" style="margin-bottom:12px">Interface set · Lucide</div>
    <div class="grid">
      <i data-lucide="message-circle"></i>
      <i data-lucide="terminal"></i>
      <i data-lucide="pen-line"></i>
      <i data-lucide="folder"></i>
      <i data-lucide="search"></i>
      <i data-lucide="settings"></i>
      <i data-lucide="paperclip"></i>
      <i data-lucide="arrow-up"></i>
      <i data-lucide="sparkles"></i>
      <i data-lucide="book-open"></i>
      <i data-lucide="check"></i>
      <i data-lucide="plus"></i>
    </div>
  </div>
  <div class="prims">
    <span class="lbl">Primitives</span>
    <i data-lucide="circle"></i>
    <i data-lucide="triangle"></i>
    <i data-lucide="square"></i>
    <span class="note">Simple geometric shapes echo the mark; the coral accent stays reserved for the brand.</span>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
