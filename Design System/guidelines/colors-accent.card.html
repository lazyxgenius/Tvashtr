<!-- @dsCard group="Colors" viewport="700x210" name="Coral accent" subtitle="The single accent — buttons, links, focus, the mark" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-ui); }
  .wrap { padding: 26px 30px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 9px; }
  .chip { height: 72px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .n { font-size: var(--fs-caption); color: var(--text-primary); font-weight: 500; }
  .h { font-size: var(--fs-micro); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .m { font-size: var(--fs-micro); color: var(--text-secondary); }
  .note { font-size: var(--fs-caption); color: var(--text-secondary); }
  .note b { color: var(--coral-600); font-weight: 600; }
</style></head>
<body><div class="wrap">
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--coral-100)"></div><div class="n">Coral 100</div><div class="h">#F7E7DF</div><div class="m">Tint bg</div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-200)"></div><div class="n">Coral 200</div><div class="h">#EFCDBE</div><div class="m">Tint border</div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-500)"></div><div class="n">Coral 500</div><div class="h">#D97757</div><div class="m">The accent</div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-600)"></div><div class="n">Coral 600</div><div class="h">#C8623F</div><div class="m">Hover</div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-700)"></div><div class="n">Coral 700</div><div class="h">#B0512F</div><div class="m">Pressed</div></div>
  </div>
  <div class="note">One accent, not a rainbow. Reserve <b>Coral 500</b> for the mark, primary buttons, links and focus rings.</div>
</div></body></html>
