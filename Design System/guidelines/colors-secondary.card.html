<!-- @dsCard group="Colors" viewport="700x200" name="Secondaries & status" subtitle="Rare — tags & illustration only; muted, warm status" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-ui); }
  .wrap { padding: 26px 30px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 9px; }
  .chip { height: 66px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .n { font-size: var(--fs-caption); color: var(--text-primary); font-weight: 500; }
  .h { font-size: var(--fs-micro); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .note { font-size: var(--fs-caption); color: var(--text-secondary); }
</style></head>
<body><div class="wrap">
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="n">Blue</div><div class="h">#6A9BCC</div></div>
    <div class="sw"><div class="chip" style="background:var(--sage-500)"></div><div class="n">Sage</div><div class="h">#788C5D</div></div>
    <div class="sw"><div class="chip" style="background:var(--amber-500)"></div><div class="n">Amber</div><div class="h">#C98A3E</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-500)"></div><div class="n">Brick</div><div class="h">#C25A4B</div></div>
    <div class="sw"><div class="chip" style="background:var(--sage-500)"></div><div class="n">Success</div><div class="h">Sage</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="n">Info</div><div class="h">Blue</div></div>
  </div>
  <div class="note">Secondaries appear only in tags and illustration — never compete with coral. Status colors stay muted and warm (no alarm-red, no neon green).</div>
</div></body></html>
