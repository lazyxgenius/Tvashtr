<!-- @dsCard group="Spacing" viewport="700x180" name="Radii" subtitle="Soft corners — 6px buttons, 8px inputs, 12px cards" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-ui); }
  .wrap { padding: 26px 30px; display: flex; gap: 22px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 72px; height: 56px; background: var(--panel-300); border: 1px solid var(--border-strong); }
  .n { font-size: var(--fs-caption); color: var(--text-primary); font-weight: 500; }
  .v { font-size: var(--fs-micro); color: var(--text-tertiary); }
</style></head>
<body><div class="wrap">
  <div class="col"><div class="box" style="border-radius:4px"></div><div class="n">xs</div><div class="v">4 · chips</div></div>
  <div class="col"><div class="box" style="border-radius:6px"></div><div class="n">sm</div><div class="v">6 · buttons</div></div>
  <div class="col"><div class="box" style="border-radius:8px"></div><div class="n">md</div><div class="v">8 · inputs</div></div>
  <div class="col"><div class="box" style="border-radius:12px"></div><div class="n">lg</div><div class="v">12 · cards</div></div>
  <div class="col"><div class="box" style="border-radius:16px"></div><div class="n">xl</div><div class="v">16 · panels</div></div>
  <div class="col"><div class="box" style="border-radius:999px;width:56px"></div><div class="n">pill</div><div class="v">badges</div></div>
</div></body></html>
