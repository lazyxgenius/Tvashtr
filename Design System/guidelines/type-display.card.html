<!-- @dsCard group="Type" viewport="700x260" name="Display serif — Newsreader" subtitle="Headlines & big moments; regular weight, tight tracking" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); }
  .wrap { padding: 26px 32px; display: flex; flex-direction: column; gap: 14px; }
  .line { display: flex; align-items: baseline; gap: 18px; }
  .spec { font-family: var(--font-ui); font-size: var(--fs-micro); color: var(--text-tertiary);
          width: 96px; flex: none; font-variant-numeric: tabular-nums; }
  .d { font-family: var(--font-serif); font-weight: 400; color: var(--text-primary);
       letter-spacing: -0.02em; line-height: 1.05; }
</style></head>
<body><div class="wrap">
  <div class="line"><span class="spec">56 · Display</span><span class="d" style="font-size:56px">Thoughtful, by design</span></div>
  <div class="line"><span class="spec">44 · Display</span><span class="d" style="font-size:44px">A calmer way to work</span></div>
  <div class="line"><span class="spec">36 · Display</span><span class="d" style="font-size:36px">Warm, editorial, unhurried</span></div>
  <div class="line"><span class="spec">28 · italic</span><span class="d" style="font-size:28px;font-style:italic">a quiet literary turn</span></div>
</div></body></html>
