<!-- @dsCard group="Spacing" viewport="700x210" name="Spacing scale" subtitle="4px base grid" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-ui); }
  .wrap { padding: 26px 30px; display: flex; gap: 10px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { width: 28px; background: var(--coral-200); border: 1px solid var(--coral-500); border-radius: 4px 4px 0 0; }
  .t { font-size: var(--fs-micro); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .v { font-size: var(--fs-micro); color: var(--text-tertiary); }
</style></head>
<body><div class="wrap">
  <div class="col"><div class="bar" style="height:4px"></div><div class="t">1</div><div class="v">4</div></div>
  <div class="col"><div class="bar" style="height:8px"></div><div class="t">2</div><div class="v">8</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="t">3</div><div class="v">12</div></div>
  <div class="col"><div class="bar" style="height:16px"></div><div class="t">4</div><div class="v">16</div></div>
  <div class="col"><div class="bar" style="height:20px"></div><div class="t">5</div><div class="v">20</div></div>
  <div class="col"><div class="bar" style="height:24px"></div><div class="t">6</div><div class="v">24</div></div>
  <div class="col"><div class="bar" style="height:32px"></div><div class="t">7</div><div class="v">32</div></div>
  <div class="col"><div class="bar" style="height:40px"></div><div class="t">8</div><div class="v">40</div></div>
  <div class="col"><div class="bar" style="height:48px"></div><div class="t">9</div><div class="v">48</div></div>
  <div class="col"><div class="bar" style="height:64px"></div><div class="t">10</div><div class="v">64</div></div>
  <div class="col"><div class="bar" style="height:80px"></div><div class="t">11</div><div class="v">80</div></div>
  <div class="col"><div class="bar" style="height:96px"></div><div class="t">12</div><div class="v">96</div></div>
</div></body></html>
