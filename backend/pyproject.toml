[project]
name = "tvashtr"
version = "0.0.1"
description = "Tvashtr backend — durable Control Plane spine + model gateway & document layer (Phase 0, P0.1–P0.2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "dbos==2.23.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "bcrypt>=4",
    "itsdangerous>=2",
    "cryptography>=43",
    "litellm==1.89.0",
    "openhands-sdk==1.28.1",
    "openhands-tools==1.28.1",
    "openhands-workspace==1.28.1",
    "pgvector>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tvashtr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
