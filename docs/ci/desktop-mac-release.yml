# Option 3 — unsigned Mac .dmg → GitHub Releases (no Apple notarization).
# Trigger: push tag desktop-v* (e.g. desktop-v0.1.0) or workflow_dispatch.
name: Desktop Mac Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/upload (e.g. desktop-v0.1.0). Leave empty to use the pushed tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  mac-dmg:
    name: Build unsigned arm64 DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend into desktop/dist-fe
        working-directory: desktop
        run: npm run build

      - name: Package unsigned Mac DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder treats empty string as "do not sign"
          CSC_IDENTITY: ""
        run: npx electron-builder --mac dmg --publish never

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=desktop-v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Tvashtr Desktop ${{ steps.tag.outputs.name }}
          body: |
            ## Tvashtr Desktop (unsigned Mac)

            Download **Tvashtr-mac.dmg**, open it, drag Tvashtr to Applications.

            **First launch (unsigned):** right-click the app → **Open** (or System Settings → Privacy & Security → Open Anyway). Gatekeeper will warn because this build is not Apple-notarized.

            Web app remains at https://tvashtr.fly.dev — Desktop adds local subscription harnesses and OS-secure credential storage.
          files: |
            desktop/release/Tvashtr-mac.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
